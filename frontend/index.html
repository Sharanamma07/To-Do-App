<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow — To-Do List Pro</title>
<style>
  :root{
    --bg:#080b14;
    --bg2:#0e1322;
    --card:rgba(18,24,40,.78);
    --card2:rgba(25,32,52,.88);
    --text:#f7f8fc;
    --muted:#9aa4bd;
    --accent:#7c5cff;
    --accent2:#34d399;
    --danger:#fb7185;
    --warn:#fbbf24;
    --border:rgba(148,163,184,.16);
    --shadow:0 20px 55px rgba(0,0,0,.28);
  }
  [data-theme="light"]{
    --bg:#f4f7ff;
    --bg2:#e9edfa;
    --card:rgba(255,255,255,.82);
    --card2:rgba(246,248,253,.95);
    --text:#172033;
    --muted:#68738b;
    --accent:#6548e8;
    --accent2:#16a878;
    --danger:#e84d67;
    --warn:#c88900;
    --border:rgba(71,85,105,.14);
    --shadow:0 18px 45px rgba(65,78,110,.13);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:Inter,'Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
    background:
      radial-gradient(circle at 12% 5%, rgba(124,92,255,.16), transparent 30%),
      radial-gradient(circle at 90% 18%, rgba(52,211,153,.10), transparent 26%),
      linear-gradient(145deg,var(--bg),var(--bg2));
    background-attachment:fixed;
    color:var(--text);
    min-height:100vh;
    padding:34px 16px 70px;
    transition:background .25s,color .25s;
  }
  body:before{
    content:'';position:fixed;inset:0;pointer-events:none;opacity:.28;
    background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
    background-size:32px 32px;
  }
  .wrap{max-width:900px;margin:0 auto;position:relative;z-index:1;}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:16px;}
  header .title h1{font-size:32px;letter-spacing:-.8px;margin:0 0 5px;font-weight:800;}
  header .title p{color:var(--muted);margin:0;font-size:13px;}
  .header-actions{display:flex;gap:8px;}
  .icon-toggle{
    background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--border);color:var(--text);width:42px;height:42px;
    border-radius:12px;cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow);transition:.2s;
  }
  .icon-toggle:hover{transform:translateY(-2px);border-color:rgba(124,92,255,.45);}
  .card{
    background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border:1px solid var(--border);border-radius:18px;padding:20px;margin-bottom:16px;
    box-shadow:var(--shadow);transition:.2s;
  }
  .card:hover{border-color:rgba(124,92,255,.22);}
  .add-row{display:flex;gap:9px;flex-wrap:wrap;}
  input[type="text"],input[type="date"],input[type="search"],select{
    padding:12px 13px;border-radius:11px;border:1px solid var(--border);
    background:var(--card2);color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:.2s;
  }
  input[type="text"]:focus,input[type="date"]:focus,input[type="search"]:focus,select:focus{
    border-color:rgba(124,92,255,.7);box-shadow:0 0 0 3px rgba(124,92,255,.12);
  }
  #taskInput{flex:1 1 260px;min-width:180px;}
  select{cursor:pointer;}
  button{cursor:pointer;border:none;border-radius:11px;font-size:14px;font-weight:650;transition:transform .15s ease,opacity .15s ease,box-shadow .2s;font-family:inherit;}
  button:active{transform:scale(.96);}
  .btn-primary{
    background:linear-gradient(135deg,#7457ff,#9b82ff);color:#fff;padding:12px 20px;
    box-shadow:0 9px 24px rgba(124,92,255,.28);
  }
  .btn-primary:hover{opacity:.94;transform:translateY(-1px);box-shadow:0 12px 28px rgba(124,92,255,.38);}
  .btn-ghost{background:var(--card2);color:var(--muted);border:1px solid var(--border);padding:9px 13px;font-size:12px;}
  .btn-ghost:hover{color:var(--text);border-color:rgba(124,92,255,.35);transform:translateY(-1px);}
  .toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px;align-items:center;justify-content:space-between;}
  .filters{display:flex;gap:7px;flex-wrap:wrap;}
  .filter-btn{background:transparent;color:var(--muted);padding:8px 12px;border:1px solid var(--border);font-size:12px;}
  .filter-btn:hover{color:var(--text);background:var(--card2);}
  .filter-btn.active{background:linear-gradient(135deg,var(--accent),#8b75ff);color:#fff;border-color:transparent;box-shadow:0 7px 18px rgba(124,92,255,.22);}
  .right-controls{display:flex;gap:8px;flex-wrap:wrap;}
  .progress-wrap{margin-top:18px;padding-top:3px;}
  .progress-bar{height:9px;background:var(--card2);border-radius:20px;overflow:hidden;border:1px solid var(--border);}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;transition:width .35s ease;box-shadow:0 0 14px rgba(52,211,153,.22);}
  .stats{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:8px;}
  ul#taskList{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;}
  .task{
    display:flex;align-items:flex-start;gap:12px;background:var(--card2);border:1px solid var(--border);
    border-radius:14px;padding:14px;cursor:grab;transition:transform .18s,border-color .18s,box-shadow .18s;
  }
  .task:hover{transform:translateY(-2px);border-color:rgba(124,92,255,.30);box-shadow:0 10px 26px rgba(0,0,0,.12);}
  .task.dragging{opacity:.42;transform:scale(.99);}
  .task.completed .task-text{text-decoration:line-through;color:var(--muted);}
  .task.overdue{border-color:rgba(251,113,133,.55);}
  .checkbox{width:21px;height:21px;border-radius:50%;border:2px solid var(--accent);background:transparent;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:transparent;font-size:12px;margin-top:1px;transition:.2s;}
  .checkbox:hover{box-shadow:0 0 0 4px rgba(124,92,255,.12);}
  .checkbox.checked{background:var(--accent2);border-color:var(--accent2);color:#07130f;}
  .task-body{flex:1;min-width:0;}
  .task-text{font-size:15px;line-height:1.45;word-break:break-word;outline:none;min-height:22px;}
  .task-meta{display:flex;gap:7px;align-items:center;margin-top:8px;flex-wrap:wrap;}
  .task-meta .priority-select,.task-meta .due-select{padding:5px 7px;border-radius:8px;font-size:11px;}
  .priority-badge{font-size:10px;padding:3px 8px;border-radius:20px;font-weight:750;text-transform:uppercase;letter-spacing:.05em;}
  .priority-high{background:rgba(251,113,133,.13);color:var(--danger);}
  .priority-medium{background:rgba(251,191,36,.13);color:var(--warn);}
  .priority-low{background:rgba(52,211,153,.13);color:var(--accent2);}
  .due-badge{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:3px;}
  .due-badge.overdue-text{color:var(--danger);font-weight:700;}
  .task-actions{display:flex;gap:5px;}
  .icon-btn{background:transparent;color:var(--muted);padding:6px 8px;font-size:15px;}
  .icon-btn:hover{color:var(--text);background:rgba(148,163,184,.08);}
  .icon-btn.delete:hover{color:var(--danger);}
  .empty{text-align:center;color:var(--muted);padding:55px 10px;font-size:14px;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--card2);backdrop-filter:blur(16px);border:1px solid var(--border);padding:11px 16px;border-radius:12px;font-size:13px;display:flex;gap:12px;align-items:center;box-shadow:0 12px 35px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;}
  .toast.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(-3px);}
  .toast button{background:none;color:var(--accent);font-weight:750;padding:0;}
  footer{text-align:center;color:var(--muted);font-size:11px;margin-top:25px;}
  @media(max-width:680px){
    body{padding:24px 12px 55px;}header .title h1{font-size:27px}.card{padding:15px;border-radius:15px}.toolbar{align-items:stretch}.right-controls{width:100%}.right-controls input[type="search"]{flex:1}.right-controls select{flex:1;min-width:140px}.filters{width:100%;}.filter-btn{flex:1;}
  }
  @media(max-width:480px){
    header{flex-wrap:wrap}.header-actions{margin-left:auto}.add-row > *{width:100%}#taskInput{flex-basis:100%}.btn-primary{width:100%}.task{padding:12px}.task-meta .due-select{max-width:135px}.stats{font-size:11px;gap:8px;}
  }
  @media(max-width:480px){
    header{flex-wrap:wrap;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">
      <h1>✨ TaskFlow</h1>
      <p>Plan smarter. Stay focused. Get things done.</p>
    </div>
    <div class="header-actions">
      <button class="icon-toggle" id="themeToggle" title="Toggle theme">🌙</button>
    </div>
  </header>

  <div class="card">
    <div class="add-row">
      <input type="text" id="taskInput" placeholder="What needs to be done?" autocomplete="off">
      <select id="priorityInput">
        <option value="high">High</option>
        <option value="medium" selected>Medium</option>
        <option value="low">Low</option>
      </select>
      <input type="date" id="dueInput" title="Due date (optional)">
      <button class="btn-primary" id="addBtn">Add Task</button>
    </div>

    <div class="toolbar">
      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="pending">Pending</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
        <button class="filter-btn" data-filter="overdue">Overdue</button>
      </div>
      <div class="right-controls">
        <input type="search" id="searchInput" placeholder="Search tasks...">
        <select id="sortInput">
          <option value="created">Sort: Newest</option>
          <option value="priority">Sort: Priority</option>
          <option value="due">Sort: Due date</option>
          <option value="alpha">Sort: A–Z</option>
        </select>
      </div>
    </div>

    <div class="toolbar">
      <div class="right-controls">
        <button class="btn-ghost" id="clearCompletedBtn">Clear completed</button>
        <button class="btn-ghost" id="exportBtn">Export JSON</button>
        <button class="btn-ghost" id="importBtn">Import JSON</button>
        <input type="file" id="importFile" accept=".json" style="display:none;">
      </div>
    </div>

    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="stats" id="stats"></div>
    </div>
  </div>

  <div class="card">
    <ul id="taskList"></ul>
    <div class="empty" id="emptyState" style="display:none;">No tasks here. Add one above 👆</div>
  </div>

  <footer>Data is stored in PostgreSQL through the Dockerized API. Drag tasks to reorder.</footer>
</div>

<div class="toast" id="toast">
  <span id="toastMsg"></span>
  <button id="toastUndo">Undo</button>
</div>

<script>
const API_URL = "http://localhost:5000/api/tasks";
const THEME_KEY = "todo_app_theme";

let tasks = [];
let currentFilter = "all";
let searchQuery = "";
let sortMode = "created";
let lastDeleted = null;
let dragSrcId = null;

const taskInput = document.getElementById("taskInput");
const priorityInput = document.getElementById("priorityInput");
const dueInput = document.getElementById("dueInput");
const addBtn = document.getElementById("addBtn");
const taskList = document.getElementById("taskList");
const emptyState = document.getElementById("emptyState");
const statsEl = document.getElementById("stats");
const progressFill = document.getElementById("progressFill");
const filterBtns = document.querySelectorAll(".filter-btn");
const searchInput = document.getElementById("searchInput");
const sortInput = document.getElementById("sortInput");
const clearCompletedBtn = document.getElementById("clearCompletedBtn");
const exportBtn = document.getElementById("exportBtn");
const importBtn = document.getElementById("importBtn");
const importFile = document.getElementById("importFile");
const themeToggle = document.getElementById("themeToggle");
const toast = document.getElementById("toast");
const toastMsg = document.getElementById("toastMsg");
const toastUndo = document.getElementById("toastUndo");

async function apiRequest(url, options = {}) {
  const response = await fetch(url, options);
  let data = null;
  try { data = await response.json(); } catch (_) {}

  if (!response.ok) {
    throw new Error(data?.error || "API request failed");
  }
  return data;
}

async function loadTasks() {
  try {
    tasks = await apiRequest(API_URL);
    render();
  } catch (error) {
    console.error("Load tasks failed:", error);
    showToast("Backend connection failed");
  }
}

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

function isOverdue(task) {
  return !task.completed && task.due_date && task.due_date < todayStr();
}

function showToast(message, undoFn = null) {
  toastMsg.textContent = message;
  toastUndo.style.display = undoFn ? "inline-block" : "none";

  toastUndo.onclick = async () => {
    if (undoFn) await undoFn();
    toast.classList.remove("show");
  };

  toast.classList.add("show");
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => {
    toast.classList.remove("show");
  }, 4000);
}

function formatDue(date) {
  if (!date) return "";
  return new Date(date + "T00:00:00").toLocaleDateString(undefined, {
    month: "short",
    day: "numeric"
  });
}

async function addTask() {
  const title = taskInput.value.trim();

  if (!title) {
    taskInput.focus();
    return;
  }

  try {
    await apiRequest(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        title: title,
        priority: priorityInput.value,
        due_date: dueInput.value || null
      })
    });

    taskInput.value = "";
    dueInput.value = "";

    await loadTasks();
    showToast("Task added successfully");
  } catch (error) {
    console.error(error);
    showToast(error.message);
  }
}

async function deleteTask(id) {
  const task = tasks.find(t => t.id === id);
  if (!task) return;

  try {
    await apiRequest(`${API_URL}/${id}`, {
      method: "DELETE"
    });

    lastDeleted = { ...task };

    await loadTasks();

    showToast("Task deleted", async () => {
      try {
        await apiRequest(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            title: lastDeleted.title,
            priority: lastDeleted.priority,
            due_date: lastDeleted.due_date,
            completed: lastDeleted.completed
          })
        });

        await loadTasks();
      } catch (error) {
        showToast(error.message);
      }
    });
  } catch (error) {
    console.error(error);
    showToast(error.message);
  }
}

async function updateTask(id, changes) {
  try {
    await apiRequest(`${API_URL}/${id}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(changes)
    });

    await loadTasks();
  } catch (error) {
    console.error(error);
    showToast(error.message);
  }
}

async function toggleComplete(id) {
  const task = tasks.find(t => t.id === id);
  if (!task) return;

  await updateTask(id, {
    completed: !task.completed
  });
}

async function editTaskText(id, newText) {
  const text = newText.trim();
  const task = tasks.find(t => t.id === id);

  if (!task) return;

  if (!text) {
    render();
    return;
  }

  if (text !== task.title) {
    await updateTask(id, { title: text });
  }
}

async function setPriority(id, priority) {
  await updateTask(id, { priority: priority });
}

async function setDue(id, dueDate) {
  await updateTask(id, { due_date: dueDate || null });
}

async function clearCompleted() {
  const completedTasks = tasks.filter(t => t.completed);

  if (completedTasks.length === 0) {
    showToast("No completed tasks");
    return;
  }

  try {
    for (const task of completedTasks) {
      await apiRequest(`${API_URL}/${task.id}`, {
        method: "DELETE"
      });
    }

    await loadTasks();
    showToast(`${completedTasks.length} completed task(s) cleared`);
  } catch (error) {
    console.error(error);
    showToast(error.message);
  }
}

function getFiltered() {
  let list = tasks.slice();

  if (currentFilter === "pending") {
    list = list.filter(t => !t.completed);
  } else if (currentFilter === "completed") {
    list = list.filter(t => t.completed);
  } else if (currentFilter === "overdue") {
    list = list.filter(isOverdue);
  }

  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    list = list.filter(t => t.title.toLowerCase().includes(q));
  }

  const priorityRank = {
    high: 0,
    medium: 1,
    low: 2
  };

  if (sortMode === "priority") {
    list.sort((a, b) =>
      (priorityRank[a.priority] ?? 1) -
      (priorityRank[b.priority] ?? 1)
    );
  } else if (sortMode === "due") {
    list.sort((a, b) =>
      (a.due_date || "9999-12-31").localeCompare(
        b.due_date || "9999-12-31"
      )
    );
  } else if (sortMode === "alpha") {
    list.sort((a, b) => a.title.localeCompare(b.title));
  } else {
    list.sort((a, b) =>
      new Date(b.created_at) - new Date(a.created_at)
    );
  }

  return list;
}

function escapeHtml(value) {
  const div = document.createElement("div");
  div.textContent = value ?? "";
  return div.innerHTML;
}

function render() {
  const filtered = getFiltered();

  taskList.innerHTML = "";
  emptyState.style.display = filtered.length ? "none" : "block";

  filtered.forEach(task => {
    const li = document.createElement("li");

    li.className =
      "task" +
      (task.completed ? " completed" : "") +
      (isOverdue(task) ? " overdue" : "");

    li.draggable = true;
    li.dataset.id = task.id;

    li.innerHTML = `
      <button class="checkbox ${task.completed ? "checked" : ""}" title="Mark complete">
        ${task.completed ? "✓" : ""}
      </button>

      <div class="task-body">
        <div class="task-text" contenteditable="true" spellcheck="false">
          ${escapeHtml(task.title)}
        </div>

        <div class="task-meta">
          <select class="priority-select">
            <option value="high" ${task.priority === "high" ? "selected" : ""}>High</option>
            <option value="medium" ${task.priority === "medium" ? "selected" : ""}>Medium</option>
            <option value="low" ${task.priority === "low" ? "selected" : ""}>Low</option>
          </select>

          <span class="priority-badge priority-${escapeHtml(task.priority)}">
            ${escapeHtml(task.priority)}
          </span>

          <input type="date" class="due-select" value="${task.due_date || ""}">

          ${
            task.due_date
              ? `<span class="due-badge ${isOverdue(task) ? "overdue-text" : ""}">
                  📅 ${formatDue(task.due_date)}
                  ${isOverdue(task) ? " (overdue)" : ""}
                 </span>`
              : ""
          }
        </div>
      </div>

      <div class="task-actions">
        <button class="icon-btn delete" title="Delete">🗑️</button>
      </div>
    `;

    li.querySelector(".checkbox")
      .addEventListener("click", () => toggleComplete(task.id));

    li.querySelector(".delete")
      .addEventListener("click", () => deleteTask(task.id));

    li.querySelector(".priority-select")
      .addEventListener("change", e =>
        setPriority(task.id, e.target.value)
      );

    li.querySelector(".due-select")
      .addEventListener("change", e =>
        setDue(task.id, e.target.value)
      );

    const textEl = li.querySelector(".task-text");

    textEl.addEventListener("blur", () => {
      editTaskText(task.id, textEl.textContent);
    });

    textEl.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        e.preventDefault();
        textEl.blur();
      }
    });

    li.addEventListener("dragstart", () => {
      dragSrcId = task.id;
      li.classList.add("dragging");
    });

    li.addEventListener("dragend", () => {
      li.classList.remove("dragging");
    });

    li.addEventListener("dragover", e => e.preventDefault());

    li.addEventListener("drop", e => {
      e.preventDefault();

      if (!dragSrcId || dragSrcId === task.id) return;

      const sourceIndex = tasks.findIndex(t => t.id === dragSrcId);
      const targetIndex = tasks.findIndex(t => t.id === task.id);

      if (sourceIndex === -1 || targetIndex === -1) return;

      const moved = tasks.splice(sourceIndex, 1)[0];
      tasks.splice(targetIndex, 0, moved);

      render();
    });

    taskList.appendChild(li);
  });

  const total = tasks.length;
  const completed = tasks.filter(t => t.completed).length;
  const overdue = tasks.filter(isOverdue).length;

  statsEl.textContent =
    `${total} total • ${completed} completed • ${total - completed} pending • ${overdue} overdue`;

  progressFill.style.width =
    total ? `${Math.round((completed / total) * 100)}%` : "0%";
}

addBtn.addEventListener("click", addTask);

taskInput.addEventListener("keydown", e => {
  if (e.key === "Enter") addTask();
});

filterBtns.forEach(btn => {
  btn.addEventListener("click", () => {
    filterBtns.forEach(b => b.classList.remove("active"));
    btn.classList.add("active");

    currentFilter = btn.dataset.filter;
    render();
  });
});

searchInput.addEventListener("input", e => {
  searchQuery = e.target.value;
  render();
});

sortInput.addEventListener("change", e => {
  sortMode = e.target.value;
  render();
});

clearCompletedBtn.addEventListener("click", clearCompleted);

exportBtn.addEventListener("click", () => {
  const blob = new Blob(
    [JSON.stringify(tasks, null, 2)],
    { type: "application/json" }
  );

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = url;
  a.download = "taskflow-export.json";
  a.click();

  URL.revokeObjectURL(url);
  showToast("Tasks exported");
});

importBtn.addEventListener("click", () => importFile.click());

importFile.addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = async event => {
    try {
      const imported = JSON.parse(event.target.result);

      if (!Array.isArray(imported)) {
        throw new Error("Invalid JSON format");
      }

      for (const task of imported) {
        if (!task.title) continue;

        await apiRequest(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            title: task.title,
            priority: task.priority || "medium",
            due_date: task.due_date || null
          })
        });
      }

      await loadTasks();
      showToast(`Imported ${imported.length} task(s)`);
    } catch (error) {
      console.error(error);
      showToast("Invalid JSON file");
    }
  };

  reader.readAsText(file);
  importFile.value = "";
});

function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  themeToggle.textContent = theme === "light" ? "☀️" : "🌙";
  localStorage.setItem(THEME_KEY, theme);
}

themeToggle.addEventListener("click", () => {
  const current =
    document.documentElement.getAttribute("data-theme") === "light"
      ? "dark"
      : "light";

  applyTheme(current);
});

applyTheme(localStorage.getItem(THEME_KEY) || "dark");

loadTasks();
</script>
</body>
</html>
