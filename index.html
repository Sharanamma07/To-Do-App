<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List Pro</title>
<style>
  :root{
    --bg:#0f1220;
    --card:#171b2e;
    --card2:#1e2338;
    --text:#eef0f7;
    --muted:#8b90a8;
    --accent:#6d5dfc;
    --accent2:#4ade80;
    --danger:#f87171;
    --warn:#fbbf24;
    --border:#2a2f4a;
  }
  [data-theme="light"]{
    --bg:#f4f5fb;
    --card:#ffffff;
    --card2:#f0f1f8;
    --text:#1b1e2b;
    --muted:#6b7086;
    --border:#e2e4f0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    padding:24px 16px 60px;
    transition:background .2s,color .2s;
  }
  .wrap{max-width:680px;margin:0 auto;}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:12px;}
  header .title h1{font-size:26px;margin:0 0 2px;}
  header .title p{color:var(--muted);margin:0;font-size:13px;}
  .header-actions{display:flex;gap:8px;}
  .icon-toggle{
    background:var(--card2);
    border:1px solid var(--border);
    color:var(--text);
    width:38px;height:38px;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
    display:flex;align-items:center;justify-content:center;
  }

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px;
    margin-bottom:16px;
    box-shadow:0 8px 24px rgba(0,0,0,0.15);
  }

  .add-row{display:flex;gap:8px;flex-wrap:wrap;}
  input[type="text"], input[type="date"], input[type="search"]{
    padding:11px 14px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--card2);
    color:var(--text);
    font-size:14px;
    font-family:inherit;
  }
  #taskInput{flex:1 1 220px;}
  select{
    padding:11px 10px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--card2);
    color:var(--text);
    font-size:14px;
  }
  button{
    cursor:pointer;
    border:none;
    border-radius:10px;
    font-size:14px;
    font-weight:600;
    transition:transform .1s ease, opacity .15s ease;
    font-family:inherit;
  }
  button:active{transform:scale(0.96);}
  .btn-primary{
    background:linear-gradient(135deg,var(--accent),#8b7bff);
    color:#fff;
    padding:11px 18px;
  }
  .btn-primary:hover{opacity:0.9;}
  .btn-ghost{
    background:var(--card2);
    color:var(--muted);
    border:1px solid var(--border);
    padding:8px 12px;
    font-size:13px;
  }
  .btn-ghost:hover{color:var(--text);}

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center;justify-content:space-between;}
  .filters{display:flex;gap:8px;flex-wrap:wrap;}
  .filter-btn{
    background:var(--card2);
    color:var(--muted);
    padding:8px 14px;
    border:1px solid var(--border);
    font-size:13px;
  }
  .filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}

  .right-controls{display:flex;gap:8px;flex-wrap:wrap;}

  .progress-wrap{margin-top:14px;}
  .progress-bar{
    height:8px;
    background:var(--card2);
    border-radius:20px;
    overflow:hidden;
    border:1px solid var(--border);
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    width:0%;
    transition:width .3s ease;
  }
  .stats{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:6px;}

  ul#taskList{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;}
  .task{
    display:flex;
    align-items:flex-start;
    gap:12px;
    background:var(--card2);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px 14px;
    cursor:grab;
  }
  .task.dragging{opacity:0.4;}
  .task.completed .task-text{text-decoration:line-through;color:var(--muted);}
  .task.overdue{border-color:var(--danger);}
  .checkbox{
    width:20px;height:20px;
    border-radius:50%;
    border:2px solid var(--accent);
    background:transparent;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    color:transparent;
    font-size:13px;
    margin-top:2px;
  }
  .checkbox.checked{background:var(--accent2);border-color:var(--accent2);color:#0f1220;}

  .task-body{flex:1;min-width:0;}
  .task-text{font-size:15px;word-break:break-word;outline:none;}
  .task-meta{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap;}
  .priority-badge{
    font-size:11px;padding:2px 8px;border-radius:20px;font-weight:700;
    text-transform:uppercase;letter-spacing:.03em;
  }
  .priority-high{background:rgba(248,113,113,0.15);color:var(--danger);}
  .priority-medium{background:rgba(251,191,36,0.15);color:var(--warn);}
  .priority-low{background:rgba(74,222,128,0.15);color:var(--accent2);}
  .due-badge{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:3px;}
  .due-badge.overdue-text{color:var(--danger);font-weight:600;}

  .task-actions{display:flex;gap:6px;}
  .icon-btn{background:transparent;color:var(--muted);padding:6px 8px;font-size:15px;}
  .icon-btn:hover{color:var(--text);}
  .icon-btn.delete:hover{color:var(--danger);}

  .empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:14px;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--card2);border:1px solid var(--border);
    padding:10px 16px;border-radius:10px;font-size:13px;
    display:flex;gap:12px;align-items:center;
    box-shadow:0 6px 20px rgba(0,0,0,0.3);
    opacity:0;pointer-events:none;transition:opacity .2s;
    z-index:50;
  }
  .toast.show{opacity:1;pointer-events:auto;}
  .toast button{background:none;color:var(--accent);font-weight:700;padding:0;}

  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:26px;}

  @media(max-width:480px){
    header{flex-wrap:wrap;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">
      <h1>📝 To-Do List Pro</h1>
      <p>Advanced task manager — search, due dates, drag-to-reorder & more</p>
    </div>
    <div class="header-actions">
      <button class="icon-toggle" id="themeToggle" title="Toggle theme">🌙</button>
    </div>
  </header>

  <div class="card">
    <div class="add-row">
      <input type="text" id="taskInput" placeholder="What needs to be done?" autocomplete="off">
      <select id="priorityInput">
        <option value="high">High</option>
        <option value="medium" selected>Medium</option>
        <option value="low">Low</option>
      </select>
      <input type="date" id="dueInput" title="Due date (optional)">
      <button class="btn-primary" id="addBtn">Add Task</button>
    </div>

    <div class="toolbar">
      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="pending">Pending</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
        <button class="filter-btn" data-filter="overdue">Overdue</button>
      </div>
      <div class="right-controls">
        <input type="search" id="searchInput" placeholder="Search tasks...">
        <select id="sortInput">
          <option value="created">Sort: Newest</option>
          <option value="priority">Sort: Priority</option>
          <option value="due">Sort: Due date</option>
          <option value="alpha">Sort: A–Z</option>
        </select>
      </div>
    </div>

    <div class="toolbar">
      <div class="right-controls">
        <button class="btn-ghost" id="clearCompletedBtn">Clear completed</button>
        <button class="btn-ghost" id="exportBtn">Export JSON</button>
        <button class="btn-ghost" id="importBtn">Import JSON</button>
        <input type="file" id="importFile" accept=".json" style="display:none;">
      </div>
    </div>

    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="stats" id="stats"></div>
    </div>
  </div>

  <div class="card">
    <ul id="taskList"></ul>
    <div class="empty" id="emptyState" style="display:none;">No tasks here. Add one above 👆</div>
  </div>

  <footer>Data is saved locally in your browser (localStorage). Drag tasks to reorder.</footer>
</div>

<div class="toast" id="toast">
  <span id="toastMsg"></span>
  <button id="toastUndo">Undo</button>
</div>

<script>
  const STORAGE_KEY = 'todo_app_tasks_v2';
  const THEME_KEY = 'todo_app_theme';
  let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  let currentFilter = 'all';
  let searchQuery = '';
  let sortMode = 'created';
  let lastDeleted = null;
  let dragSrcId = null;

  const taskInput = document.getElementById('taskInput');
  const priorityInput = document.getElementById('priorityInput');
  const dueInput = document.getElementById('dueInput');
  const addBtn = document.getElementById('addBtn');
  const taskList = document.getElementById('taskList');
  const emptyState = document.getElementById('emptyState');
  const statsEl = document.getElementById('stats');
  const progressFill = document.getElementById('progressFill');
  const filterBtns = document.querySelectorAll('.filter-btn');
  const searchInput = document.getElementById('searchInput');
  const sortInput = document.getElementById('sortInput');
  const clearCompletedBtn = document.getElementById('clearCompletedBtn');
  const exportBtn = document.getElementById('exportBtn');
  const importBtn = document.getElementById('importBtn');
  const importFile = document.getElementById('importFile');
  const themeToggle = document.getElementById('themeToggle');
  const toast = document.getElementById('toast');
  const toastMsg = document.getElementById('toastMsg');
  const toastUndo = document.getElementById('toastUndo');

  function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }

  function todayStr(){ return new Date().toISOString().slice(0,10); }

  function isOverdue(t){
    return !t.completed && t.due && t.due < todayStr();
  }

  function showToast(msg, undoFn){
    toastMsg.textContent = msg;
    toast.classList.add('show');
    toastUndo.style.display = undoFn ? 'inline-block' : 'none';
    toastUndo.onclick = () => {
      if(undoFn) undoFn();
      toast.classList.remove('show');
    };
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toast.classList.remove('show'), 4000);
  }

  function addTask(){
    const text = taskInput.value.trim();
    if(!text) return;
    tasks.unshift({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
      text,
      priority: priorityInput.value,
      due: dueInput.value || null,
      completed: false,
      createdAt: new Date().toISOString(),
      order: tasks.length ? Math.min(...tasks.map(t=>t.order ?? 0)) - 1 : 0
    });
    taskInput.value = '';
    dueInput.value = '';
    save();
    render();
  }

  function deleteTask(id){
    const idx = tasks.findIndex(t => t.id === id);
    if(idx === -1) return;
    lastDeleted = { task: tasks[idx], index: idx };
    tasks.splice(idx, 1);
    save();
    render();
    showToast('Task deleted', () => {
      if(lastDeleted){
        tasks.splice(lastDeleted.index, 0, lastDeleted.task);
        save();
        render();
      }
    });
  }

  function toggleComplete(id){
    const t = tasks.find(t => t.id === id);
    if(t) t.completed = !t.completed;
    save();
    render();
  }

  function editTaskText(id, newText){
    const t = tasks.find(t => t.id === id);
    if(t && newText.trim()) t.text = newText.trim();
    save();
    render();
  }

  function setPriority(id, priority){
    const t = tasks.find(t => t.id === id);
    if(t) t.priority = priority;
    save();
    render();
  }

  function setDue(id, due){
    const t = tasks.find(t => t.id === id);
    if(t) t.due = due || null;
    save();
    render();
  }

  function clearCompleted(){
    const removed = tasks.filter(t => t.completed);
    if(removed.length === 0) return;
    tasks = tasks.filter(t => !t.completed);
    save();
    render();
    showToast(`${removed.length} completed task(s) cleared`, () => {
      tasks = tasks.concat(removed);
      save();
      render();
    });
  }

  function getFiltered(){
    let list = tasks.slice();
    if(currentFilter === 'pending') list = list.filter(t => !t.completed);
    else if(currentFilter === 'completed') list = list.filter(t => t.completed);
    else if(currentFilter === 'overdue') list = list.filter(isOverdue);

    if(searchQuery){
      const q = searchQuery.toLowerCase();
      list = list.filter(t => t.text.toLowerCase().includes(q));
    }

    const prioRank = { high:0, medium:1, low:2 };
    if(sortMode === 'priority') list.sort((a,b) => prioRank[a.priority]-prioRank[b.priority]);
    else if(sortMode === 'due') list.sort((a,b) => (a.due||'9999') > (b.due||'9999') ? 1 : -1);
    else if(sortMode === 'alpha') list.sort((a,b) => a.text.localeCompare(b.text));
    else list.sort((a,b) => (a.order ?? 0) - (b.order ?? 0));

    return list;
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function formatDue(due){
    if(!due) return '';
    const d = new Date(due + 'T00:00:00');
    return d.toLocaleDateString(undefined, {month:'short', day:'numeric'});
  }

  function render(){
    const filtered = getFiltered();
    taskList.innerHTML = '';
    emptyState.style.display = filtered.length === 0 ? 'block' : 'none';

    filtered.forEach(t => {
      const li = document.createElement('li');
      li.className = 'task' + (t.completed ? ' completed' : '') + (isOverdue(t) ? ' overdue' : '');
      li.draggable = true;
      li.dataset.id = t.id;

      li.innerHTML = `
        <button class="checkbox ${t.completed ? 'checked' : ''}" title="Mark complete">${t.completed ? '✓' : ''}</button>
        <div class="task-body">
          <div class="task-text" contenteditable="true" spellcheck="false">${escapeHtml(t.text)}</div>
          <div class="task-meta">
            <select class="priority-select">
              <option value="high" ${t.priority==='high'?'selected':''}>High</option>
              <option value="medium" ${t.priority==='medium'?'selected':''}>Medium</option>
              <option value="low" ${t.priority==='low'?'selected':''}>Low</option>
            </select>
            <span class="priority-badge priority-${t.priority}">${t.priority}</span>
            <input type="date" class="due-select" value="${t.due || ''}">
            ${t.due ? `<span class="due-badge ${isOverdue(t)?'overdue-text':''}">📅 ${formatDue(t.due)}${isOverdue(t)?' (overdue)':''}</span>` : ''}
          </div>
        </div>
        <div class="task-actions">
          <button class="icon-btn delete" title="Delete">🗑️</button>
        </div>
      `;

      li.querySelector('.checkbox').addEventListener('click', () => toggleComplete(t.id));
      li.querySelector('.delete').addEventListener('click', () => deleteTask(t.id));
      li.querySelector('.priority-select').addEventListener('change', (e) => setPriority(t.id, e.target.value));
      li.querySelector('.due-select').addEventListener('change', (e) => setDue(t.id, e.target.value));

      const textEl = li.querySelector('.task-text');
      textEl.addEventListener('blur', () => editTaskText(t.id, textEl.textContent));
      textEl.addEventListener('keydown', (e) => {
        if(e.key === 'Enter'){ e.preventDefault(); textEl.blur(); }
      });

      li.addEventListener('dragstart', () => { dragSrcId = t.id; li.classList.add('dragging'); });
      li.addEventListener('dragend', () => li.classList.remove('dragging'));
      li.addEventListener('dragover', (e) => e.preventDefault());
      li.addEventListener('drop', (e) => {
        e.preventDefault();
        if(!dragSrcId || dragSrcId === t.id) return;
        const srcIdx = tasks.findIndex(x => x.id === dragSrcId);
        const tgtIdx = tasks.findIndex(x => x.id === t.id);
        if(srcIdx === -1 || tgtIdx === -1) return;
        const [moved] = tasks.splice(srcIdx, 1);
        tasks.splice(tgtIdx, 0, moved);
        tasks.forEach((tk, i) => tk.order = i);
        save();
        render();
      });

      taskList.appendChild(li);
    });

    const total = tasks.length;
    const completed = tasks.filter(t => t.completed).length;
    const overdue = tasks.filter(isOverdue).length;
    statsEl.textContent = `${total} total • ${completed} completed • ${total - completed} pending • ${overdue} overdue`;
    progressFill.style.width = total ? `${Math.round((completed/total)*100)}%` : '0%';
  }

  addBtn.addEventListener('click', addTask);
  taskInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') addTask(); });

  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      filterBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      render();
    });
  });

  searchInput.addEventListener('input', (e) => { searchQuery = e.target.value; render(); });
  sortInput.addEventListener('change', (e) => { sortMode = e.target.value; render(); });
  clearCompletedBtn.addEventListener('click', clearCompleted);

  exportBtn.addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(tasks, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'tasks-export.json';
    a.click();
    URL.revokeObjectURL(url);
  });

  importBtn.addEventListener('click', () => importFile.click());
  importFile.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try{
        const imported = JSON.parse(evt.target.result);
        if(Array.isArray(imported)){
          tasks = tasks.concat(imported.map(t => ({
            ...t,
            id: Date.now().toString(36) + Math.random().toString(36).slice(2,7)
          })));
          save();
          render();
          showToast(`Imported ${imported.length} task(s)`);
        }
      }catch(err){
        showToast('Invalid JSON file');
      }
    };
    reader.readAsText(file);
    importFile.value = '';
  });

  function applyTheme(theme){
    document.documentElement.setAttribute('data-theme', theme);
    themeToggle.textContent = theme === 'light' ? '☀️' : '🌙';
    localStorage.setItem(THEME_KEY, theme);
  }
  themeToggle.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    applyTheme(current);
  });
  applyTheme(localStorage.getItem(THEME_KEY) || 'dark');

  render();
</script>
</body>
</html>
